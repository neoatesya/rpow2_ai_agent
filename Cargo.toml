[package]
name = "rpow-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2.1.0", features = ["rand_core"] }
sha2 = "0.10.8"
rand = "0.8.5"
hex = "0.4.3"
reqwest = { version = "0.12.4", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tokio = { version = "1.37.0", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.38"
colored = "2.1.0"
num-format = "0.4.4"
num_cpus = "1.16.0"
